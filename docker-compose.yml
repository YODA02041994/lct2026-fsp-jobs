# Локальный запуск: docker compose up --build  → http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fsp
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: fsp
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsp -d fsp"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      FSP_DATABASE_URL: postgresql+psycopg://fsp:fsp@db:5432/fsp
      FSP_SECRET_KEY: ${FSP_SECRET_KEY:-change-me-in-production}
      FSP_PUBLIC_URL: ${FSP_PUBLIC_URL:-http://localhost:8080}
      FSP_DEMO_MODE: "true"
      FSP_SEED_DEMO: "true"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
volumes:
  dbdata:
